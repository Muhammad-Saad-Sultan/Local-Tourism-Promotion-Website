<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Lakeview Valley</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1>Lakeview Valley Tourism</h1>
        
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./destination.html">Destinations</a></li>
          <li><a href="./packages.html">Packages</a></li>
          <li><a href="./gallery.htm">Gallery</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h2>Contact the visitor center</h2>
        <p>Need help planning your trip? Send us a message and we will guide you.</p>
      </section>

      <section class="card">
        <form>
          <input type="text" name="name" placeholder="Your name" />
          <input type="email" name="email" placeholder="Your email" />
          <textarea
            name="message"
            rows="6"
            placeholder="Tell us what you would like to know"
          ></textarea>
          <button class="button" type="submit">Send Inquiry</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Email: visit@lakeviewvalley.example | Phone: +123 456 7890</p>
    </footer>
  </body>
</html>
